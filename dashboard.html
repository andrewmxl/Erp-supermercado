
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Ejecutivo - ERP Supermercado</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 30px; }
    h1 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 25px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .card h3 { margin: 0; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 28px; font-weight: bold; margin-top: 10px; color: #f1f5f9; }
    .green { color: #4ade80 !important; }
    .blue { color: #38bdf8 !important; }
    .charts-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
    .chart-card { background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .alert-box { background-color: #451a03; border: 1px solid #78350f; color: #fde68a; padding: 20px; border-radius: 12px; }
    .alert-box ul { margin: 10px 0 0 0; padding-left: 20px; }
  </style>
</head>
<body>

  <h1>📊 Panel Control Ejecutivo & Analítica ERP</h1>
  
  <div class="grid">
    <div class="card">
      <h3>Ventas Totales</h3>
      <div class="value blue">$95</div>
    </div>
    <div class="card">
      <h3>Ganancia Neta</h3>
      <div class="value green">$35</div>
    </div>
    <div class="card">
      <h3>Margen de Utilidad</h3>
      <div class="value green">36.84%</div>
    </div>
    <div class="card">
      <h3>Transacciones</h3>
      <div class="value">1</div>
    </div>
  </div>

  <div class="charts-container">
    <div class="chart-card">
      <h3>Rendimiento Financiero (Ingresos vs Costos)</h3>
      <canvas id="financialChart" height="120"></canvas>
    </div>
    <div class="chart-card">
      <h3>Producto Destacado</h3>
      <canvas id="productChart" height="240"></canvas>
    </div>
  </div>

  
  <div class="alert-box">
    <strong>⚠️ Alertas de Reabastecimiento Crítico (1):</strong>
    <ul>
      <li><strong>Leche Entera 1L</strong> — Stock Actual: <span style="color:#f87171;">3</span> (Mínimo Requerido: 5)</li>
    </ul>
  </div>
  

  <script>
    // Gráfico de Barras: Comparativa Ingresos vs Costos vs Ganancia
    const ctx1 = document.getElementById('financialChart').getContext('2d');
    new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: ['Ingresos Totales', 'Costos Operativos', 'Ganancia Neta'],
        datasets: [{
          label: 'Monto en $ MXN',
          data: [95, 60, 35],
          backgroundColor: ['#38bdf8', '#f87171', '#4ade80'],
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
        }
      }
    });

    // Gráfico de Donas: Producto Estrella
    const ctx2 = document.getElementById('productChart').getContext('2d');
    new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: ['Pan Dulce Integrado', 'Otros Productos'],
        datasets: [{
          data: [45, 50],
          backgroundColor: ['#4ade80', '#334155']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#f8fafc' }, position: 'bottom' }
        }
      }
    });
  </script>
</body>
</html>
